# 每日薅羊毛情报收集（分时段更新不同板块）
name: Daily Collect

on:
  schedule:
    # 09:00 北京 = 01:00 UTC → 更新 AI 板块
    - cron: "0 1 * * *"
    # 15:00 北京 = 07:00 UTC → 更新游戏板块
    - cron: "0 7 * * *"
    # 21:00 北京 = 13:00 UTC → 整理（生成 SVG + README）
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式: ai / games / drive / finalize / all / 逗号分隔如 ai,drive"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 确定运行模式
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "手动触发模式: ${{ github.event.inputs.mode }}"
          else
            HOUR=$(date -u +%H)
            echo "当前 UTC 小时: $HOUR"
            if [ "$HOUR" = "01" ]; then
              echo "mode=ai,drive" >> $GITHUB_OUTPUT
              echo "定时任务: 更新 AI + 开车线报板块"
            elif [ "$HOUR" = "07" ]; then
              echo "mode=games" >> $GITHUB_OUTPUT
              echo "定时任务: 更新游戏板块"
            elif [ "$HOUR" = "13" ]; then
              echo "mode=finalize" >> $GITHUB_OUTPUT
              echo "定时任务: 整理"
            else
              echo "mode=finalize" >> $GITHUB_OUTPUT
              echo "定时任务(非标准时间): 整理"
            fi
          fi

      - name: 运行收集脚本
        env:
          TZ: Asia/Shanghai
        run: |
          python scripts/collect.py ${{ steps.mode.outputs.mode }}

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/calendar.svg docs/data/ README.md
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "chore(data): ${{ steps.mode.outputs.mode }} update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
