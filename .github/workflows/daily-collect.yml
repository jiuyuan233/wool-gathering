# 每日薅羊毛情报收集
name: Daily Collect

on:
  schedule:
    # 每天北京时间 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch: # 支持手动触发，方便首次跑通
    inputs:
      debug:
        description: "开启 debug 日志"
        required: false
        default: "false"

permissions:
  contents: write   # 允许 push 回仓库
  pages: write
  id-token: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 校验 Secrets
        run: |
          if [ -z "${{ secrets.AI_API_KEY }}" ]; then
            echo "::error::缺少 Secret: AI_API_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.AI_BASE_URL }}" ]; then
            echo "::warning::未设置 AI_BASE_URL，将使用默认 https://api.openai.com/v1"
          fi
          if [ -z "${{ secrets.AI_MODEL }}" ]; then
            echo "::warning::未设置 AI_MODEL，将使用默认 gpt-4o-mini"
          fi

      - name: 运行收集脚本
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TZ: Asia/Shanghai
        run: |
          python scripts/collect.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ README.md
          if git diff --cached --quiet; then
            echo "今日无更新，跳过提交"
          else
            git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 触发 Pages 重新构建
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

  # Pages 部署单独一个 job，依赖 collect 完成
  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 docs/ 作为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
