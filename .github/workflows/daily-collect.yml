# 每日薅羊毛情报收集（分时段更新不同板块）
name: Daily Collect

on:
  schedule:
    # 任务分散到全天，避开整点（减轻免费源网站压力，避免集中请求）
    # 北京时间 = UTC + 8
    - cron: "17 22 * * *"   # 06:17 北京 → ai-cloud（云厂商）
    - cron: "23 1 * * *"    # 09:23 北京 → ai-blog（博客聚合）
    - cron: "41 3 * * *"    # 11:41 北京 → drive（V2EX 开车线报）
    - cron: "37 6 * * *"    # 14:37 北京 → games-direct（Epic/Steam/GOG 官方 API）
    - cron: "53 8 * * *"    # 16:53 北京 → games-blog（ITAD/itch.io/Reddit）
    - cron: "47 12 * * *"   # 20:47 北京 → finalize（整理：SVG + README）
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式: ai / ai-cloud / ai-blog / games / games-direct / games-blog / drive / finalize / all / 逗号分隔"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 确定运行模式
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "手动触发模式: ${{ github.event.inputs.mode }}"
          else
            HOUR=$(date -u +%H)
            echo "当前 UTC 小时: $HOUR"
            case "$HOUR" in
              22) echo "mode=ai-cloud" >> $GITHUB_OUTPUT;       echo "定时任务: 云厂商 (06:17 北京)" ;;
              01) echo "mode=ai-blog" >> $GITHUB_OUTPUT;        echo "定时任务: 博客聚合 (09:23 北京)" ;;
              03) echo "mode=drive" >> $GITHUB_OUTPUT;          echo "定时任务: 开车线报 (11:41 北京)" ;;
              06) echo "mode=games-direct" >> $GITHUB_OUTPUT;   echo "定时任务: 游戏官方API (14:37 北京)" ;;
              08) echo "mode=games-blog" >> $GITHUB_OUTPUT;     echo "定时任务: 游戏博客聚合 (16:53 北京)" ;;
              12) echo "mode=finalize" >> $GITHUB_OUTPUT;       echo "定时任务: 整理 (20:47 北京)" ;;
              *)  echo "mode=finalize" >> $GITHUB_OUTPUT;       echo "定时任务(非标准时间): 整理" ;;
            esac
          fi

      - name: 运行收集脚本
        env:
          TZ: Asia/Shanghai
          # AI 中转站配置（ChatAnywhere，OpenAI 兼容协议）
          # 免费版：每周 50000 点 + 每天 100 次请求，用弱模型 deepseek-v3-2 省额度
          # AI_API_KEY 从 GitHub Secret 读，不 commit 到代码
          AI_BASE_URL: https://api.chatanywhere.org/v1
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: deepseek-v3-2
        run: |
          python scripts/collect.py ${{ steps.mode.outputs.mode }}

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/calendar.svg docs/data/ README.md
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
          else
            git commit -m "chore(data): ${{ steps.mode.outputs.mode }} update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
